name = "microblog"
main = "src/index.ts"
compatibility_date = "2026-11-17"
compatibility_flags = ["nodejs_compat"]

# Public HTML, feeds, and /api run in the Worker. Hashed Vite bundles and the
# default social image are static files and skip the Worker.
[assets]
directory = "./client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*", "!/assets/*", "!/og-default.png", "!/favicon.svg", "!/vite.svg"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[vars]
SITE_URL = "https://blog.manig.dev"

# D1 Database binding. Do not change the database id.
[[d1_databases]]
binding = "DB"
database_name = "blog-db"
database_id = "51d64d29-a518-457a-95b1-fff58c072bed"
migrations_dir = "migrations"

# R2 bucket provisioned for cover images and other media.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "microblog-media"
